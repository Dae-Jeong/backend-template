spring:
  application:
    name: ${APP_NAME:backend-template-spring}
  datasource:
    url: ${DB_PRIMARY_URL:jdbc:h2:file:./data/template;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=1000;WRITE_DELAY=0}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: ${DB_POOL_TIMEOUT_MS:1000}
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT_SECONDS:10}s
server:
  address: ${SERVER_HOST:127.0.0.1}
  port: ${SERVER_PORT:18085}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
        health: actuator-health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.example.backendtemplate: ${LOG_LEVEL:INFO}
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
app:
  environment: ${APP_ENVIRONMENT:local}
