global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: nestjs
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:18084]
  - job_name: spring-boot
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:18086]
